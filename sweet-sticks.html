<title>Sweet Sticks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700&display=swap">
<style>
/* Layout: one full-bleed 3D stage on plain beige; the stick's paper unrolls into the card. Single committed look. */
:root{
  --counter:#e8dcc4; --check:rgba(46,110,78,.16); --marigold:#f4b223; --oxblood:#5b1a1f;
  --paper:#fbf4e4; --paper-edge:#efe2c4; --candy:#fffdf8; --candy-tip:#e2557a; --ink-soft:#7a4a45;
  --display:"Space Mono", ui-monospace, Menlo, Consolas, monospace;
  --body:"Space Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0; overflow:hidden; font-family:var(--body); color:var(--oxblood);
  background-color:var(--counter);
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
#stage{position:fixed; inset:0; touch-action:none; cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block; width:100%; height:100%}
.tabs{top:calc(env(safe-area-inset-top,0px) + 50px)}
body.on-all #all{padding-top:calc(env(safe-area-inset-top,0px) + 112px)}
.tabs{
  position:fixed; z-index:5; left:50%; top:calc(env(safe-area-inset-top,0px) + 16px); transform:translateX(-50%);
  display:flex; gap:4px; padding:4px; border-radius:999px; background:#ddd0b6; box-shadow:0 0 0 6px var(--counter);
}
.tabs a{
  display:block; padding:8px 18px; border-radius:999px; text-decoration:none; color:var(--oxblood);
  font:700 13px var(--body); letter-spacing:.06em; white-space:nowrap; max-width:42vw; overflow:hidden; text-overflow:ellipsis;
}
.tabs a[aria-current="page"]{background:var(--oxblood); color:var(--paper)}
.tabs a:focus-visible{outline:3px solid var(--marigold); outline-offset:2px}

/* All: a shelf of everyone's packs */
#all{
  position:fixed; inset:0; z-index:4; overflow-y:auto; background:var(--counter);
  padding:calc(env(safe-area-inset-top,0px) + 76px) 16px calc(env(safe-area-inset-bottom,0px) + 48px);
  -webkit-overflow-scrolling:touch; touch-action:pan-y;
}
.shelf{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:20px 12px; max-width:560px; margin-inline:auto}
.pack-tile{
  display:grid; gap:6px; justify-items:center; text-align:center; text-decoration:none; color:var(--oxblood);
  min-width:0; padding:4px 0; border-radius:12px;
}
.pack-tile .thumb{width:100%; aspect-ratio:2/3; max-width:100%; display:grid; place-items:center; transition:transform .25s}
.pack-tile img{width:100%; height:100%; object-fit:contain}
.pack-tile:hover .thumb, .pack-tile:focus-visible .thumb{transform:translateY(-4px) rotate(-2deg)}
.pack-tile:focus-visible{outline:3px solid var(--marigold); outline-offset:2px}
.pack-tile b{font-size:13px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pack-tile small{font-size:10px; opacity:.65; line-height:1.3; max-width:100%; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.pack-tile.soon b{opacity:.75}
.foot{margin-top:40px; text-align:center; font-size:11px; letter-spacing:.08em; color:var(--ink-soft)}
.foot a{color:var(--oxblood); font-weight:700; text-decoration:none}
.foot a:hover{text-decoration:underline; text-underline-offset:3px}
.hint{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 28px); transform:translateX(-50%);
  background:var(--oxblood); color:var(--paper); font-weight:700; font-size:14px; letter-spacing:.02em;
  padding:10px 18px; border-radius:999px; white-space:nowrap; pointer-events:none;
  transition:opacity .35s, transform .35s; box-shadow:0 6px 18px rgba(91,26,31,.25);
}
.hint.gone{opacity:0; transform:translate(-50%,10px)}
.hint .arrow{display:inline-block; margin-right:6px; animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-4px)}}

/* Scroll card */
#scrim{position:fixed; inset:0; background:rgba(40,24,20,.38); opacity:0; pointer-events:none; transition:opacity .4s}
#scrim.on{opacity:1; pointer-events:auto}
/* card = the stick's paper unrolling downward; --p goes 0 (rolled) to 1 (flat) */
#scroll{
  --p:0; position:fixed; left:50%; top:50%; width:min(340px, calc(100vw - 48px));
  transform:translate(-50%,-50%); opacity:0; pointer-events:none;
  filter:drop-shadow(0 14px 26px rgba(40,20,15,.28));
}
#scroll.rolled{opacity:1; pointer-events:auto}
.sheet{
  position:relative;
  clip-path:inset(0 0 calc((1 - var(--p)) * 100%) 0);
  background:
    repeating-linear-gradient(90deg, transparent 0 9px, rgba(120,100,80,.045) 9px 10px),
    linear-gradient(90deg, rgba(0,0,0,.035), transparent 8%, transparent 92%, rgba(0,0,0,.035)),
    var(--candy);
}
.curl{
  position:absolute; left:-6px; right:-6px; z-index:2; pointer-events:none;
  top:calc(var(--p) * 100% - 12px); height:calc(24px - var(--p) * 12px); border-radius:999px;
  background:linear-gradient(180deg,#ffffff 0%, var(--candy) 40%, #ddd5c8 100%);
  box-shadow:0 4px 8px rgba(40,20,15,.18), inset 0 -2px 3px rgba(0,0,0,.08);
  opacity:calc(1 - max(0, var(--p) - .9) * 10);
}
.curl::after{
  content:""; position:absolute; right:0; top:0; bottom:0; width:calc(16px - var(--p) * 12px); border-radius:999px;
  background:var(--accent,var(--candy-tip)); box-shadow:inset 0 -3px 4px rgba(0,0,0,.18); opacity:calc(1 - var(--p) * 1.4);
}
.card{padding:30px 24px 26px; display:grid; gap:18px}
.eyebrow{margin:0; font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.card h1{margin:0; font-family:var(--display); font-weight:700; font-size:36px; line-height:1; letter-spacing:-.02em; text-wrap:balance}
.role{margin:6px 0 0; font-size:16px; line-height:1.45; font-weight:400; font-size:14px}
dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:8px 14px; font-size:14px; line-height:1.4; border-block:1.5px dashed rgba(91,26,31,.3); padding-block:14px}
dt{font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--ink-soft); padding-top:2px}
dd{margin:0; min-width:0}
.links{display:grid; gap:8px}
.link{
  display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:0;
  padding:11px 14px; border-radius:10px; border:1.5px solid var(--oxblood); color:var(--oxblood);
  text-decoration:none; font-weight:700; font-size:14px; background:transparent; font-family:inherit; cursor:pointer; text-align:left;
}
.link span:first-child{flex:none; white-space:nowrap; user-select:text; -webkit-user-select:text}
.link small{font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.7; flex:none}
.link small{text-transform:none; letter-spacing:.02em; font-size:12px; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.link.primary small{text-transform:uppercase; letter-spacing:.1em; font-size:11px}
.link.primary{background:var(--accent,var(--oxblood)); color:var(--accent-ink,var(--paper))}
.link:focus-visible{outline:3px solid var(--marigold); outline-offset:2px}
#back:focus{outline:none} #back:focus-visible{text-decoration:underline; text-underline-offset:4px}
#back{
  justify-self:center; border:0; background:none; font:700 13px var(--body); color:var(--ink-soft);
  letter-spacing:.12em; text-transform:uppercase; padding:8px 12px; cursor:pointer;
}
.fine{margin:0; text-align:center; font-size:11px; color:var(--ink-soft); letter-spacing:.06em}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important}
  #scrim{transition-duration:.01s!important}
}
</style>

<div id="stage" aria-label="A pack of sweet sticks. Flick up or tap to open, then tap a stick."></div>
<nav class="tabs" aria-label="Packs"><a href="#all" id="tabAll">All</a><a href="#vishesh" id="tabMe">Vishesh</a></nav>
<section id="all" hidden aria-label="Everyone's packs"><div class="shelf" id="shelf"></div><footer class="foot">Built on <a href="https://visheshgupta.framer.website" target="_blank" rel="noopener">vssgpt</a></footer></section>
<div class="hint gone" id="hint"><span class="arrow">↑</span><span id="hintText">Flick up to open</span></div>


<div id="scrim"></div>
<div id="scroll" role="dialog" aria-modal="true" aria-labelledby="cardName">
  <div class="curl"></div>
  <div class="sheet">
    <div class="card">
      <div>
        <h1 id="cardName"></h1>
        <p class="role" id="cardRole"></p>
      </div>
      <dl id="cardDl"></dl>
      <div class="links" id="cardLinks"></div>
      <button id="back" type="button">Chew it</button>
    </div>
  </div>
</div>

  const flickUp=dy<-40 && Math.abs(dy)>Math.abs(dx)*1.1;
  const flickDown=dy>50 && Math.abs(dy)>Math.abs(dx)*1.1;
  if(state==='closed' && (tap||flickUp)) return openLid();
  if(state==='open'){
    if(tap){
      const r=stage.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
      ray.setFromCamera(ndc,camera); const hit=ray.intersectObjects(stickMeshes,false)[0];
      if(hit) return pull(hit.object.userData.stick);
      return closeLid();
    } else if(flickDown) return closeLid();
  }
}
stage.addEventListener('pointerup',endDrag); stage.addEventListener('pointercancel',endDrag);

// ---------- loop ----------
// ---------- parallax: phone tilt, with pointer as the fallback ----------
const tilt={x:0,y:0,tx:0,ty:0}; let gyro=false, askedMotion=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
addEventListener('deviceorientation',e=>{
  if(RM||e.gamma==null||e.beta==null) return; gyro=true;
  tilt.tx=clamp(e.gamma/28,-1,1); tilt.ty=clamp((e.beta-50)/28,-1,1);
});
function askMotion(){ // iOS needs a tap before it shares tilt
  if(askedMotion) return; askedMotion=true;
  try{ const D=window.DeviceOrientationEvent; if(D&&typeof D.requestPermission==='function') D.requestPermission().catch(()=>{}); }catch(e){}
}
addEventListener('pointerdown',askMotion,{capture:true});
addEventListener('pointermove',e=>{
  if(RM||gyro||e.pointerType==='touch') return;
  tilt.tx=clamp((e.clientX/innerWidth-.5)*2,-1,1); tilt.ty=clamp((e.clientY/innerHeight-.5)*2,-1,1);
});
let lastT=0;
function loop(now){
  const dt=Math.min(.05,(now-(lastT||now))/1000); lastT=now; tickSmoke(now,dt); tickCrumbs(now,dt);
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i]; const p=Math.min(1,(now-tw.t0)/tw.dur); tw.fn(tw.ease(p)); if(p>=1){tweens.splice(i,1); tw.res();}}
  drag.x+=(drag.tx-drag.x)*.12; drag.y+=(drag.ty-drag.y)*.12;
  const bob=RM?0:Math.sin(now/900)*.03;
  tilt.x+=(tilt.tx-tilt.x)*.08; tilt.y+=(tilt.ty-tilt.y)*.08;
  pack.rotation.set(base.rx+drag.y+bob*.4+tilt.y*.14, base.ry+drag.x+tilt.x*.32, base.rz-tilt.x*.03);
  pack.position.set(tilt.x*.22, base.y+bob-tilt.y*.1, 0);
  shadow.position.x=tilt.x*.1;
  {const k=1-(base.y+bob)*.15; shadow.scale.set(k,k,1); shadow.material.opacity=Math.max(0,Math.min(1,1+base.y*.25));}
  renderer.render(scene,camera); requestAnimationFrame(loop);
}

// ---------- card ----------
function el(tag,props={},kids=[]){const e=document.createElement(tag); Object.assign(e,props); kids.forEach(k=>e.append(k)); return e;}
function fillCard(P){
  const K=PAL[P.pal]; scroll.style.setProperty('--accent',K.box); scroll.style.setProperty('--accent-ink',K.onBox);
  document.getElementById('cardName').textContent=P.first;
  const role=document.getElementById('cardRole'); role.textContent=P.role; if(P.sub){role.append(el('br'), P.sub);}
  const dl=document.getElementById('cardDl'); dl.replaceChildren(...P.details.flatMap(([k,v])=>[el('dt',{textContent:k}),el('dd',{textContent:v})]));
  const links=[];
  if(P.site) links.push(el('a',{className:'link primary',href:P.site.url,target:'_blank',rel:'noopener'},[el('span',{textContent:P.site.label}),el('small',{textContent:'Visit ↗'})]));
  P.links.forEach((l,i)=>links.push(el('a',{className:'link',href:l.url,target:'_blank',rel:'noopener'},[el('span',{textContent:l.label}),el('small',{textContent:`${l.handle} ↗`})])));
  document.getElementById('cardLinks').replaceChildren(...links);
}

// ---------- All: snapshot every pack once, in its rest pose ----------
const thumbs={};
let thumbKit=null;
function thumbFor(P){
  if(thumbs[P.slug]) return thumbs[P.slug];
  if(!thumbKit){
    const r=new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
    r.setPixelRatio(1); r.setSize(320,480,false); r.outputEncoding=THREE.sRGBEncoding;
    const sc=new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xfff6e6, 0x7d9a86, 0.75));
    const k=new THREE.DirectionalLight(0xffffff,.85); k.position.set(3,5,6); sc.add(k);
    const cam=new THREE.PerspectiveCamera(30,320/480,.1,100); cam.position.set(0,.3,6.6); cam.lookAt(0,0,0);
    const holder=new THREE.Group(); sc.add(holder); const inn=new THREE.Group(); inn.position.y=-H/2; holder.add(inn);
    holder.rotation.set(POSE_REST.rx, POSE_REST.ry, POSE_REST.rz);
    thumbKit={r,sc,cam,inn};
  }
  const {r,sc,cam,inn}=thumbKit;
  disposePack(inn); buildPack(P,inn); r.render(sc,cam);
  thumbs[P.slug]=r.domElement.toDataURL('image/png');
  return thumbs[P.slug];
}
function buildShelf(){
  // whoever you came from goes first
  const order=cameFrom?[cameFrom].concat(PEOPLE.filter(p=>p!==cameFrom)):PEOPLE;
  const shelf=document.getElementById('shelf');
  shelf.replaceChildren(...order.map(P=>{
    const img=el('img',{alt:`${P.first}'s pack`, decoding:'async'});
    const a=el('a',{className:'pack-tile'+(P.soon?' soon':''), href:'#'+P.slug},[el('div',{className:'thumb'},[img]), el('b',{textContent:P.first}), el('small',{textContent:P.soon?'Coming soon':`${P.role}, ${P.sub}`})]);
    return a;
  }));
  // render thumbnails one per frame so the page stays responsive
  const imgs=[...shelf.querySelectorAll('img')]; let i=0;
  (function next(){ if(i>=order.length) return; imgs[i].src=thumbFor(order[i]); i++; requestAnimationFrame(next); })();
}

// ---------- routing: #all, #slug, or /slug on your own host ----------
const tabAll=document.getElementById('tabAll'), tabMe=document.getElementById('tabMe'), allView=document.getElementById('all');
let booted=false;
// a person's own link (/config/sameen/) makes them the focus, even when opening #all from there; otherwise Vishesh
const pathP=(()=>{const seg=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'').toLowerCase().replace(/\.html?$/,''); return bySlug[seg]||null;})();
let focusP=pathP||PEOPLE.find(p=>p.slug==='vishesh'); // default pack stays Vishesh
let cameFrom=pathP; // set once someone's own pack has been opened; the shelf leads with them
function readRoute(){
  const h=decodeURIComponent(location.hash.slice(1)).toLowerCase();
  if(h==='all') return 'all';
  if(bySlug[h]) return h;
  const seg=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'').toLowerCase().replace(/\.html?$/,'');
  if(seg==='all') return 'all';
  if(bySlug[seg]) return seg;
  return null;
}
function applyRoute(){
  const r=readRoute();
  if(r==='all'){
    document.body.classList.add('on-all'); allView.hidden=false; tabAll.setAttribute('aria-current','page'); tabMe.removeAttribute('aria-current');
    hint.classList.add('gone'); buildShelf(); return;
  }
  const P=r?bySlug[r]:focusP; if(r) cameFrom=P;
  document.body.classList.remove('on-all'); allView.hidden=true; tabMe.setAttribute('aria-current','page'); tabAll.removeAttribute('aria-current');
  tabMe.textContent=P.first; tabMe.href='#'+P.slug; document.title=`${P.first} · Sweet Sticks`;
  if(P!==current || !booted){ focusP=P; enter(P); }
}
addEventListener('hashchange',applyRoute);

let entering=0;
async function enter(P){
  const my=++entering; booted=true;
  // reset anything mid-flight
  tweens.length=0; scroll.classList.remove('rolled'); scrim.classList.remove('on'); hint.classList.add('gone');
  if(pulled && pulled.parent===scene) scene.remove(pulled); pulled=null;
  build(P); fillCard(P);
  lidHinge.rotation.x=0; base.rx=.42; base.ry=0; base.rz=0; base.y=-3.5; state='entering';
  await tween(1100,p=>{base.y=-3.5*(1-p);},back);
  if(my!==entering) return;
  await new Promise(r=>setTimeout(r,RM?0:350));
  if(my!==entering) return;
  state='closed'; openLid();
}

// ---------- boot ----------
const fontsReady=Promise.race([
  Promise.all([document.fonts.load(`700 80px "Space Mono"`),document.fonts.load(`400 26px "Space Mono"`)]),
  new Promise(r=>setTimeout(r,2500))
]).catch(()=>{});
fontsReady.then(()=>{
  resize(); applyRoute(); if(!booted){ build(focusP); fillCard(focusP); booted=true; state='closed'; lidHinge.rotation.x=0; base.rx=POSE_REST.rx; base.ry=POSE_REST.ry; base.rz=POSE_REST.rz; }
  requestAnimationFrame(loop);
});
})();
</script>
